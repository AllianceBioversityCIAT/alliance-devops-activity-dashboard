AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DevOps Activity Dashboard MVP - Phase 5 infrastructure (backend + frontend hosting)

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [local, dev, prod]
    Default: dev
  AwsRegion:
    Type: String
    Default: us-east-1
  BackendFunctionName:
    Type: String
    Default: devops-activity-dashboard-backend
  DynamoDbTableName:
    Type: String
    Default: jenkinsexecutions_test
  DeploymentMetadataTableName:
    Type: String
    Default: deployment_metadata
    Description: DynamoDB table for job metadata (partition key job_name; Query by job_name only)
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoAppClientId:
    Type: String
    Default: ""
  CognitoClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  CognitoIssuer:
    Type: String
    Default: ""
  CognitoDomain:
    Type: String
    Default: ""
  FrontendRedirectUri:
    Type: String
    Default: ""
  CognitoIdentityProvider:
    Type: String
    Default: ""
  LogLevel:
    Type: String
    AllowedValues: [debug, info, warn, error]
    Default: info
  AwsAccessKeyId:
    Type: String
    NoEcho: true
    Default: ""
  AwsSecretAccessKey:
    Type: String
    NoEcho: true
    Default: ""
  CloudFrontPriceClass:
    Type: String
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Default: PriceClass_100

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Architectures: [x86_64]
    Tags:
      Project: DEVOPS
      Functionality: dashboard
      Environment: !Ref EnvironmentName

Resources:
  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Tags:
        Project: DEVOPS
        Functionality: dashboard
        Environment: !Ref EnvironmentName

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${BackendFunctionName}-${EnvironmentName}"
      CodeUri: ../../apps/backend/
      Handler: lambda.handler
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          AWS_REGION_DO: !Ref AwsRegion
          AWS_ACCESS_KEY_ID_DO: !Ref AwsAccessKeyId
          AWS_SECRET_ACCESS_KEY_DO: !Ref AwsSecretAccessKey
          DYNAMODB_TABLE_NAME: !Ref DynamoDbTableName
          DYNAMODB_DEPLOYMENT_METADATA_TABLE_NAME: !Ref DeploymentMetadataTableName
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
          COGNITO_CLIENT_SECRET: !Ref CognitoClientSecret
          COGNITO_ISSUER: !Ref CognitoIssuer
          COGNITO_DOMAIN: !Ref CognitoDomain
          FRONTEND_REDIRECT_URI: !Ref FrontendRedirectUri
          COGNITO_IDENTITY_PROVIDER: !Ref CognitoIdentityProvider
          LOG_LEVEL: !Ref LogLevel
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:DescribeTable
              Resource:
                - !Sub "arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${DynamoDbTableName}"
                - !Sub "arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${DynamoDbTableName}/index/*"
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:DescribeTable
              Resource: !Sub "arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${DeploymentMetadataTableName}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Minify: true
        Target: es2020
        Sourcemap: false
        Format: cjs
        OutExtension:
          - .js=.js
        External:
          - aws-sdk

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: DEVOPS
        - Key: Functionality
          Value: dashboard
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-frontend-oac"
        Description: OAC for DevOps dashboard frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: !Ref CloudFrontPriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: DEVOPS
        - Key: Functionality
          Value: dashboard
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  BackendApiBaseUrl:
    Description: Base URL for backend API stage
    Value: !Sub "https://${BackendApi}.execute-api.${AwsRegion}.amazonaws.com/${EnvironmentName}"
  FrontendBucketOutput:
    Description: S3 bucket hosting frontend static assets
    Value: !Ref FrontendBucket
  FrontendCloudFrontDomain:
    Description: CloudFront domain for frontend
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendCloudFrontDistributionId:
    Description: CloudFront distribution ID for frontend
    Value: !Ref FrontendDistribution